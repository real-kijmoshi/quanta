name: Release
# Publish a version bump on main, or push an explicit v* tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$version" = "$GITHUB_REF_NAME"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            previous=$(git show "$BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "$version" != "$previous" ]]; then
              if git show-ref --verify --quiet "refs/tags/v$version"; then
                echo "Version v$version already has a tag; refusing to republish." >&2
                exit 1
              fi
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: bash tests/setup-test.sh

  windows-maintenance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/maintenance-test.mjs

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build release files
        run: |
          mkdir dist
          # npm pack drops package-lock.json; a shrinkwrap ships so the installers can run `npm ci`.
          npm shrinkwrap
          npm pack --pack-destination dist
          mv dist/*.tgz dist/quanta.tgz
          cp install/install.sh install/install.ps1 dist/
          cp deploy/install.sh dist/setup-server.sh
          cd dist && sha256sum quanta.tgz install.sh install.ps1 setup-server.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.publish == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, windows-maintenance, package, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
        run: |
          node --input-type=module <<'JS' > release-notes.md
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const notes = readFileSync('CHANGELOG.md', 'utf8').split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
          if (!notes) throw new Error(`Missing changelog for ${version}`);
          console.log(notes);
          JS
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Quanta ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
